  <body class="home">
    <div class="starfield" aria-hidden="true"></div>
    <nav class="navbar navbar-expand-lg navbar-dark bg-glass sticky-top">
  <div class="container">

    <header class="container py-5">
      <h1 class="display-4 fw-bold text-white mb-0">Sonnensystem</h1>
    </header>

    <main class="container pb-5">
      <section class="system-hero card card-glass text-white">
        <div class="system-hero-inner">
          <svg class="orbit-svg" viewBox="0 0 1200 520" preserveAspectRatio="none" aria-hidden="true">
            <g fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1.2">
              <ellipse cx="250" cy="260" rx="170" ry="62"></ellipse>
              <ellipse cx="250" cy="260" rx="245" ry="86"></ellipse>
              <ellipse cx="250" cy="260" rx="320" ry="112"></ellipse>
              <ellipse cx="250" cy="260" rx="400" ry="140"></ellipse>
              <ellipse cx="250" cy="260" rx="480" ry="168"></ellipse>
              <ellipse cx="250" cy="260" rx="560" ry="196"></ellipse>
              <ellipse cx="250" cy="260" rx="645" ry="226"></ellipse>
              <ellipse cx="250" cy="260" rx="735" ry="258"></ellipse>
            </g>
          </svg>

          <button id="sunBtn" class="sun-btn" type="button" aria-label="Sonne">
            <span class="sun-disc" aria-hidden="true"></span>
            <span class="planet-label">Sonne</span>
          </button>

          <div id="systemPlanets" class="system-planets" role="list" aria-label="Planeten"></div>
        </div>
      </section>
    </main>
